<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antibody Motif Explorer</title><style>body{font:16px system-ui;max-width:1100px;margin:40px auto;padding:20px;color:#173047}input,button,select{font:inherit;padding:8px;margin:6px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ccc;text-align:left}section{background:#edf4f5;padding:16px;border-radius:8px}#output{overflow:auto}</style><h1>Antibody Motif Explorer</h1><p>Sequence-level research screening. DRAC is an example, not a validated recognition mechanism.</p><section><a href="https://opig.stats.ox.ac.uk/webapps/sabdab-sabpred/therasabdab/search/">Download Thera-SAbDab CSV</a><p><input type="file" id="file" accept=".csv,.tsv"></p><label>Asset column <select id="asset"></select></label><label>Sequence columns <select id="chains" multiple size="4"></select></label><label>Motif <input id="motif" value="DRAC"></label><label>Minimum identity (%) <input id="threshold" type="number" min="0" max="100" value="100"></label><p>Use X for any standard amino acid; select one or more sequence columns. Positions are raw, one-based.</p><button id="run">Screen</button><button id="csv">Export CSV</button><button id="json">Export JSON</button></section><p id="status" role="status"></p><div id="output"></div><script>
'use strict';
const $=id=>document.getElementById(id);let rows=[],headers=[],hits=[];
const aa='ACDEFGHIKLMNPQRSTVWY';
// Parse quoted CSV including embedded newlines and doubled quotes.
function parse(s,sep){let out=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q;}else if(!q&&c===sep){row.push(v);v=''}else if(!q&&(c==='\n'||c==='\r')){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(Boolean))out.push(row);row=[];v=''}else v+=c;}if(q)throw Error('Unclosed quoted field');row.push(v);if(row.some(Boolean))out.push(row);return out;}
$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;const s=(await f.text()).replace(/^\uFEFF/,'');const data=parse(s,f.name.endsWith('.tsv')?'\t':',');headers=data.shift()||[];rows=data;hits=[];$('output').replaceChildren();for(const id of ['asset','chains']){$(id).replaceChildren();headers.forEach((h,i)=>{const o=new Option(h,i);if(id==='chains'&&/sequence|^vh$|^vl$|heavy chain|light chain/i.test(h))o.selected=true;$(id).add(o)})}const n=headers.findIndex(h=>/therapeutic|antibody name|^name$/i.test(h));if(n>=0)$('asset').value=n;$('status').textContent=rows.length+' records loaded; confirm column mapping.'}catch(e){$('status').textContent=e.message}};
$('run').onclick=()=>{try{hits=[];$('output').replaceChildren();const m=$('motif').value.trim().toUpperCase(),t=Number($('threshold').value),cs=[...$('chains').selectedOptions].map(o=>Number(o.value));if(!m||![...m].every(c=>aa.includes(c)||c==='X')||!Number.isFinite(t)||t<0||t>100||!cs.length||!rows.length)throw Error('Import data, select sequence columns and enter a valid motif/threshold.');let skipped=0;for(const r of rows)for(const col of cs){const seq=(r[col]||'').replace(/\s/g,'').toUpperCase();if(!seq||!/^[ACDEFGHIKLMNPQRSTVWYX]+$/.test(seq)){skipped++;continue}for(let i=0;i<=seq.length-m.length;i++){const segment=seq.slice(i,i+m.length);let matches=0;for(let j=0;j<m.length;j++)if(aa.includes(segment[j])&&(m[j]==='X'||m[j]===segment[j]))matches++;const score=100*matches/m.length;if(score>=t)hits.push({asset:r[Number($('asset').value)]||'',chain:headers[col],position:i+1,segment,identity:score,structure:'Not assessed',metadata:Object.fromEntries(headers.map((h,k)=>[h,r[k]||'']))})}}hits.sort((a,b)=>b.identity-a.identity||a.asset.localeCompare(b.asset)||a.position-b.position);const table=document.createElement('table');const keys=['asset','chain','position','segment','identity','structure'];const head=table.createTHead().insertRow();keys.forEach(k=>{const c=document.createElement('th');c.textContent=k;head.append(c)});const body=table.createTBody();hits.slice(0,1000).forEach(h=>{const r=body.insertRow();keys.forEach(k=>r.insertCell().textContent=typeof h[k]==='number'?Number(h[k].toFixed(2)):h[k])});$('output').replaceChildren(table);$('status').textContent=hits.length+' motif hits; '+skipped+' empty/invalid sequences skipped; showing up to 1000. Export includes all hits.'}catch(e){$('status').textContent=e.message}};
function download(name,s,type){const u=URL.createObjectURL(new Blob([s],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('json').onclick=()=>download('hits.json',JSON.stringify(hits,null,2),'application/json');$('csv').onclick=()=>{const keys=['asset','chain','position','segment','identity','structure','metadata'];const esc=x=>{let s=typeof x==='object'?JSON.stringify(x):String(x);if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};download('hits.csv',[keys.join(','),...hits.map(h=>keys.map(k=>esc(h[k])).join(','))].join('\n'),'text/csv')};
</script></html>
